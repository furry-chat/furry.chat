{%- assign discord = site.data.config.discord -%}
{%- assign invite_url = "https://discord.gg/" | append: discord.invite -%}
<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	{% seo %}

	<meta name="keywords" content="{{ site.data.config.meta.keywords }}" />
	<meta name="color-scheme" content="light dark" />
	<meta name="theme-color" content="{{ site.data.config.meta.theme-color-light }}" media="(prefers-color-scheme: light)" />
	<meta name="theme-color" content="{{ site.data.config.meta.theme-color-dark }}" media="(prefers-color-scheme: dark)" />

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" />
	<link rel="stylesheet" href="{{ "/assets/css/theme.css" | relative_url }}" />

	<link rel="icon" href="{{ "/assets/img/favicon.ico" | relative_url }}" sizes="32x32" />
	<link rel="icon" href="{{ "/assets/img/logo.png" | relative_url }}" type="image/png" />
	<link rel="apple-touch-icon" href="{{ "/assets/img/apple-touch-icon.png" | relative_url }}" />
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">

	<symbol id="i-chat" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></symbol>
	<symbol id="i-rocket" viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></symbol>
	<symbol id="i-calendar" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></symbol>
	<symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
	<symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></symbol>
	<symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
	<symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
	<symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
	<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
	<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
</svg>

<header class="topbar">
	<div class="wrap topbar__inner">
		<a class="brand" href="{{ "/" | relative_url }}">
			<img class="logo" src="{{ "/assets/img/logo.png" | relative_url }}" alt="" width="36" height="36" />
			<span>{{ site.title }}</span>
		</a>
		<a class="btn btn--primary btn--sm" href="{{ invite_url }}" target="_blank" rel="noopener">
			<svg class="icon" aria-hidden="true"><use href="#i-discord"/></svg>
			<span>Присоединиться</span>
		</a>
	</div>
</header>

{{ content }}

<footer class="footer">
	<div class="wrap footer__inner">
		<p>
			<img class="logo" src="{{ "/assets/img/logo.png" | relative_url }}" alt="" width="24" height="24" />
			<span>© 2017–{{ site.time | date: "%Y" }} {{ site.title }}</span>
		</p>
		<nav aria-label="Ссылки в подвале">
			<a href="{{ invite_url }}" target="_blank" rel="noopener">Discord</a>
			<a href="{{ site.data.config.links.ranking }}" target="_blank" rel="noopener">Рейтинг</a>
			<a href="{{ site.data.config.links.source }}" target="_blank" rel="noopener">Исходный код</a>
		</nav>
	</div>
</footer>

<script src="{{ "/assets/js/theme.js" | relative_url }}" defer></script>
</body>
</html>
